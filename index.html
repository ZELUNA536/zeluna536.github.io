<!DOCTYPE html>
<html>
<head>
<title>OB-MANIA</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3212/3212608.png">

<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:Arial, Helvetica, sans-serif;
  overflow:hidden;
}

/* MENUS */
.screen{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:100;
}

h1{
  font-size:64px;
  margin-bottom:20px;
}

button{
  padding:15px 40px;
  margin:10px;
  font-size:18px;
  border:none;
  border-radius:30px;
  cursor:pointer;
}

/* GAME */
#game{
  position:absolute;
  bottom:0;
  width:100vw;
  height:300px;
  border-top:3px solid white;
  overflow:hidden;
}

/* ROCKET */
#rocket{
  width:40px;
  height:60px;
  background:linear-gradient(cyan,blue);
  position:absolute;
  left:80px;
  bottom:10px;
  border-radius:8px;
}

/* OBSTACLE */
.obstacle{
  width:40px;
  height:80px;
  background:red;
  position:absolute;
  bottom:10px;
}

/* HUD */
#hud{
  position:fixed;
  top:10px;
  left:10px;
  z-index:10;
  font-size:18px;
}
</style>
</head>

<body>

<div id="mainMenu" class="screen">
  <h1>OB-MANIA</h1>
  <button onclick="startGame()">PLAY</button>
</div>

<div id="pauseMenu" class="screen" style="display:none">
  <h2>Paused</h2>
  <button onclick="resumeGame()">Resume (P)</button>
  <button onclick="restartGame()">Restart (R)</button>
</div>

<div id="hud">
  Score: <span id="score">0</span>
</div>

<div id="game">
  <div id="rocket"></div>
</div>

<audio id="jumpSound" src="https://assets.mixkit.co/sfx/preview/mixkit-game-jump-437.mp3"></audio>
<audio id="crashSound" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-over-194.mp3"></audio>

<script>
let rocket = document.getElementById("rocket");
let game = document.getElementById("game");

let score = 0;
let gravity = 0;
let jumping = false;
let running = false;
let paused = false;
let speed = 6;

/* CONTROLS */
document.addEventListener("keydown", e => {
  if(e.code === "Space") jump();
  if(e.code === "KeyP") togglePause();
  if(e.code === "KeyR") restartGame();
});

document.addEventListener("click", ()=>{ if(running && !paused) jump(); });

function jump(){
  if(!jumping && running && !paused){
    gravity = 18;
    jumping = true;
    document.getElementById("jumpSound").play();
  }
}

/* GAME START */
function startGame(){
  document.getElementById("mainMenu").style.display="none";
  running = true;
  spawnObstacle();
}

/* PHYSICS LOOP */
setInterval(()=>{
  if(!running || paused) return;

  let bottom = parseInt(getComputedStyle(rocket).getPropertyValue("bottom"));
  bottom += gravity;
  gravity -= 1.2;

  if(bottom <= 10){
    bottom = 10;
    jumping = false;
  }

  rocket.style.bottom = bottom+"px";
},20);

/* OBSTACLES */
function spawnObstacle(){
  if(!running) return;

  let obs = document.createElement("div");
  obs.className = "obstacle";
  obs.style.left = "100%";
  game.appendChild(obs);

  let move = setInterval(()=>{
    if(paused) return;

    obs.style.left = obs.offsetLeft - speed + "px";

    let r = rocket.getBoundingClientRect();
    let o = obs.getBoundingClientRect();

    if(r.right > o.left && r.left < o.right && r.bottom > o.top){
      document.getElementById("crashSound").play();
      endGame();
    }

    if(obs.offsetLeft < -50){
      obs.remove();
      clearInterval(move);
      score++;
      document.getElementById("score").innerText = score;
    }
  },20);

  setTimeout(spawnObstacle,1500);
}

/* PAUSE */
function togglePause(){
  if(!running) return;
  paused = !paused;
  document.getElementById("pauseMenu").style.display = paused ? "flex" : "none";
}

function resumeGame(){
  paused = false;
  document.getElementById("pauseMenu").style.display="none";
}

/* END */
function endGame(){
  running = false;
  alert("Game Over! Score: " + score);
  location.reload();
}

function restartGame(){
  location.reload();
}
</script>

</body>
</html>
