<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PROJECT: SYNTHETIC ECHO | TPP MASTERPIECE</title>
    <style>
        :root {
            --neon: #00f3ff;
            --danger: #ff3131;
            --grad: linear-gradient(135deg, #00f3ff, #ff00ff);
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }

        /* UI Layering */
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; color: white; }
        
        /* Menu & Settings */
        .overlay-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(20,20,25,0.9) 0%, #050505 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; pointer-events: all; transition: 0.5s;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .glitch-text {
            font-size: 4rem; font-weight: 900; background: var(--grad);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 20px; text-transform: uppercase; letter-spacing: 5px;
        }

        .btn {
            background: var(--grad); border: none; color: white; padding: 15px 40px;
            font-size: 1.2rem; border-radius: 50px; cursor: pointer; font-weight: bold;
            transition: 0.3s; margin: 10px; text-transform: uppercase;
        }
        .btn:hover { transform: scale(1.1); box-shadow: 0 0 30px var(--neon); }

        /* Shortcuts Legend */
        #shortcuts-bar {
            position: absolute; bottom: 0; width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 20px; display: flex; justify-content: center; gap: 30px;
        }
        .key-box { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 5px; border-bottom: 3px solid var(--neon); margin-right: 5px; }

        /* Settings Icon */
        #settings-trigger {
            position: absolute; top: 20px; right: 20px; pointer-events: all;
            cursor: pointer; font-size: 24px; opacity: 0.7;
        }

        canvas { display: block; }
    </style>
</head>
<body>

<div id="main-menu" class="overlay-screen">
    <div class="glass-panel">
        <div class="glitch-text">SYNTHETIC ECHO</div>
        <div style="margin-bottom: 20px;">
            <select id="gender" class="btn" style="font-size: 0.9rem; padding: 10px 20px;">
                <option value="F">FEMALE AVATAR</option>
                <option value="M">MALE AVATAR</option>
            </select>
        </div>
        <button class="btn" onclick="startGame()">Initialize Facility</button>
    </div>
</div>

<div id="settings-menu" class="overlay-screen" style="display: none; background: rgba(0,0,0,0.85);">
    <div class="glass-panel">
        <h2>ENGINE SETTINGS</h2>
        <p>FOV: <input type="range" id="fov-range" min="50" max="110" value="75"></p>
        <p>WEATHER: 
            <button onclick="setWeather('clear')">CLEAR</button>
            <button onclick="setWeather('storm')">STORM</button>
        </p>
        <button class="btn" onclick="toggleSettings()">BACK TO GAME</button>
        <button class="btn" style="background: var(--danger);" onclick="location.reload()">REPLAY / RESET</button>
    </div>
</div>

<div id="ui-container">
    <div id="settings-trigger" onclick="toggleSettings()">⚙ SETTINGS</div>
    <div id="shortcuts-bar">
        <span><span class="key-box">W A S D</span> WALK</span>
        <span><span class="key-box">SHIFT</span> SPRINT</span>
        <span><span class="key-box">SPACE</span> JUMP</span>
        <span><span class="key-box">F</span> FLASHLIGHT</span>
        <span><span class="key-box">V</span> SWITCH CAMERA</span>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
let scene, camera, renderer, player, clock, flashLight;
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
let velocity = new THREE.Vector3();
let direction = new THREE.Vector3();
let isThirdPerson = true;

function startGame() {
    document.getElementById('main-menu').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('main-menu').style.display = 'none';
        init();
        animate();
    }, 500);
}

function init() {
    clock = new THREE.Clock();
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a12);
    scene.fog = new THREE.FogExp2(0x0a0a12, 0.03);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    // Dynamic Lighting
    const hemi = new THREE.HemisphereLight(0x4444ff, 0x000000, 0.6);
    scene.add(hemi);

    // Player Model (The Character)
    const gender = document.getElementById('gender').value;
    const playerGeo = new THREE.CapsuleGeometry(0.4, 1, 4, 8);
    const playerMat = new THREE.MeshStandardMaterial({ 
        color: gender === 'F' ? 0xff00ff : 0x00ffff,
        metalness: 0.8, roughness: 0.2 
    });
    player = new THREE.Mesh(playerGeo, playerMat);
    player.position.y = 1;
    player.castShadow = true;
    scene.add(player);

    // Flashlight
    flashLight = new THREE.SpotLight(0xffffff, 4, 40, 0.5, 0.3, 2);
    flashLight.castShadow = true;
    player.add(flashLight);
    flashLight.position.set(0, 0.5, 0.5);
    flashLight.target.position.set(0, 0.5, 5);
    player.add(flashLight.target);

    // Environment
    const floorGeo = new THREE.PlaneGeometry(1000, 1000);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.5 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Industrial Pillars (Visibility fix)
    const pillarGeo = new THREE.BoxGeometry(2, 15, 2);
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    for(let i=0; i<40; i++) {
        const p = new THREE.Mesh(pillarGeo, pillarMat);
        p.position.set(Math.sin(i)*20, 7.5, -i*10);
        p.castShadow = true; p.receiveShadow = true;
        scene.add(p);
    }

    // Controls
    window.addEventListener('keydown', (e) => {
        if(e.code === 'KeyW') moveForward = true;
        if(e.code === 'KeyS') moveBackward = true;
        if(e.code === 'KeyA') moveLeft = true;
        if(e.code === 'KeyD') moveRight = true;
        if(e.code === 'KeyF') flashLight.intensity = flashLight.intensity ? 0 : 4;
        if(e.code === 'KeyV') isThirdPerson = !isThirdPerson;
    });
    window.addEventListener('keyup', (e) => {
        if(e.code === 'KeyW') moveForward = false;
        if(e.code === 'KeyS') moveBackward = false;
        if(e.code === 'KeyA') moveLeft = false;
        if(e.code === 'KeyD') moveRight = false;
    });

    document.body.addEventListener('click', () => {
        if(document.getElementById('main-menu').style.display === 'none') {
            document.body.requestPointerLock();
        }
    });

    window.addEventListener('mousemove', (e) => {
        if(document.pointerLockElement === document.body) {
            player.rotation.y -= e.movementX * 0.003;
        }
    });
}

function toggleSettings() {
    const menu = document.getElementById('settings-menu');
    const isHidden = menu.style.display === 'none';
    menu.style.display = isHidden ? 'flex' : 'none';
    if(isHidden) document.exitPointerLock();
}

function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    // Movement Logic
    velocity.x -= velocity.x * 10.0 * delta;
    velocity.z -= velocity.z * 10.0 * delta;

    direction.z = Number(moveForward) - Number(moveBackward);
    direction.x = Number(moveRight) - Number(moveLeft);
    direction.normalize();

    if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
    if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

    player.translateX(-velocity.x * delta);
    player.translateZ(-velocity.z * delta);

    // Camera Logic (Third Person)
    if(isThirdPerson) {
        const relativeCameraOffset = new THREE.Vector3(0, 3, 6);
        const cameraOffset = relativeCameraOffset.applyMatrix4(player.matrixWorld);
        camera.position.lerp(cameraOffset, 0.1);
        camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
    } else {
        camera.position.copy(player.position);
        camera.position.y += 0.8;
        camera.rotation.copy(player.rotation);
    }

    renderer.render(scene, camera);
}

document.getElementById('fov-range').addEventListener('input', (e) => {
    camera.fov = e.target.value;
    camera.updateProjectionMatrix();
});

function setWeather(type) {
    if(type === 'storm') {
        scene.fog.density = 0.08;
        scene.background = new THREE.Color(0x050005);
    } else {
        scene.fog.density = 0.03;
        scene.background = new THREE.Color(0x0a0a12);
    }
}
</script>
</body>
</html>
