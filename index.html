<!DOCTYPE html>
<html>
<head>
<title>ECHO SHIFT: SECTION 9</title>
<style>
html,body{margin:0;overflow:hidden;background:black;font-family:Arial}
#hud{
position:fixed;bottom:15px;left:50%;transform:translateX(-50%);
background:linear-gradient(90deg,#0f2027,#203a43,#2c5364);
padding:10px 20px;border-radius:20px;color:white;
display:flex;gap:15px;font-size:12px;opacity:.85}
#intro{
position:fixed;inset:0;background:black;display:flex;
align-items:center;justify-content:center;color:white;z-index:5}
#intro h1{font-size:60px;letter-spacing:6px}
#subtitle{
position:fixed;bottom:80px;width:100%;text-align:center;
color:white;font-size:18px;opacity:.8}
canvas{display:block}
</style>
</head>
<body>

<div id="intro">
<div>
<h1>ECHO SHIFT</h1>
<p>If you're hearing this... you already entered.</p>
<p>Click to wake up</p>
</div>
</div>

<div id="subtitle"></div>

<div id="hud">
<div>WASD Move</div>
<div>Mouse Look</div>
<div>Shift Run</div>
<div>F Interact</div>
<div>T Torch</div>
<div>M Switch Body</div>
</div>

<canvas id="game"></canvas>

<audio id="amb" loop src="https://cdn.pixabay.com/audio/2022/03/15/audio_5b7c46b0a3.mp3"></audio>
<audio id="step" src="https://cdn.pixabay.com/audio/2022/02/23/audio_53c1a98c59.mp3"></audio>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;canvas.height=innerHeight;

let keys={},yaw=0,pitch=0;
let torch=false,body="male";
let fear=0;

let player={x:0,z:0,speed:2};
let enemy={x:20,z:20,active:true};

function subtitle(text){
let s=document.getElementById("subtitle");
s.innerText=text;
setTimeout(()=>s.innerText="",3000);
}

function drawWorld(){
ctx.fillStyle="black";
ctx.fillRect(0,0,canvas.width,canvas.height);

// fog
ctx.fillStyle="rgba(30,30,40,0.4)";
ctx.fillRect(0,0,canvas.width,canvas.height);

// flashlight
if(torch){
let g=ctx.createRadialGradient(
canvas.width/2,canvas.height/2,50,
canvas.width/2,canvas.height/2,300);
g.addColorStop(0,"rgba(255,255,200,0.4)");
g.addColorStop(1,"rgba(0,0,0,0)");
ctx.fillStyle=g;
ctx.fillRect(0,0,canvas.width,canvas.height);
}

// enemy
let dx=enemy.x-player.x;
let dz=enemy.z-player.z;
let dist=Math.sqrt(dx*dx+dz*dz);
if(dist<30){
let size=200/dist;
ctx.fillStyle="rgba(255,0,0,0.6)";
ctx.beginPath();
ctx.arc(canvas.width/2+dx*10,canvas.height/2+dz*10,size,0,Math.PI*2);
ctx.fill();
fear+=0.05;
}
}

function update(){
let sp=keys["shift"]?4:2;
if(keys["w"])player.z-=sp;
if(keys["s"])player.z+=sp;
if(keys["a"])player.x-=sp;
if(keys["d"])player.x+=sp;

// enemy stalk
if(enemy.active){
enemy.x+=(player.x-enemy.x)*0.002;
enemy.z+=(player.z-enemy.z)*0.002;
}

if(fear>50){
subtitle("Your mind is not yours anymore...");
enemy.active=true;
}
}

function loop(){
update();
drawWorld();
requestAnimationFrame(loop);
}

// controls
onkeydown=e=>{
keys[e.key.toLowerCase()]=true;
if(e.key=="t"){torch=!torch}
if(e.key=="m"){
body=body=="male"?"female":"male";
subtitle("Body switched: "+body);
}
}
onkeyup=e=>keys[e.key.toLowerCase()]=false;

onmousemove=e=>{
yaw+=e.movementX*0.002;
pitch+=e.movementY*0.002;
}

// intro
document.getElementById("intro").onclick=()=>{
document.getElementById("intro").style.display="none";
document.getElementById("amb").play();
canvas.requestPointerLock();
subtitle("Subject 09 regained consciousness");
loop();
}
</script>
</body>
</html>
