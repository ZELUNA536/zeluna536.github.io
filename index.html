<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT: SYNTHETIC ECHO | MASTERPIECE</title>
    <style>
        :root {
            --glitch-red: #ff3131;
            --neon-blue: #00f3ff;
            --dark-bg: #050505;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #000; color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        /* CRT Filter Overlay - pointer-events: none is CRITICAL */
        #crt-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%; 
            pointer-events: none; 
            z-index: 5000;
        }

        /* Main Menu - z-index must be higher than canvas but lower than CRT */
        #main-menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #111 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 4000;
            transition: opacity 1s ease;
            pointer-events: all;
        }

        .glitch-title {
            font-size: clamp(2rem, 8vw, 5rem); font-weight: 900; 
            color: white; text-transform: uppercase;
            text-shadow: 2px 0 var(--glitch-red), -2px 0 var(--neon-blue);
            margin-bottom: 10px;
        }

        .btn-start {
            background: transparent; border: 2px solid var(--neon-blue);
            color: var(--neon-blue); padding: 15px 40px; font-size: 1.5rem;
            cursor: pointer; transition: 0.3s; font-family: inherit;
            margin-top: 30px; text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .btn-start:hover {
            background: var(--neon-blue); color: #000;
            box-shadow: 0 0 30px var(--neon-blue);
        }

        /* Game HUD */
        #gui-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1000; display: none;
            flex-direction: column; justify-content: space-between;
        }

        #controls-legend {
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            padding: 25px; display: flex; justify-content: center; gap: 30px;
            font-size: 11px; letter-spacing: 1.5px; color: #666;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .key-hint { color: #fff; font-weight: bold; background: #222; padding: 2px 6px; border-radius: 3px; border: 1px solid #444; }

        #subtitles {
            position: absolute; bottom: 120px; width: 100%; text-align: center;
            font-size: 22px; color: #fff; text-shadow: 0 0 10px #000;
            font-weight: 300; opacity: 0; transition: opacity 0.5s;
        }

        canvas { display: block; }
    </style>
</head>
<body>

<div id="crt-overlay"></div>

<div id="main-menu">
    <div class="glitch-title">SYNTHETIC ECHO</div>
    <div style="color: #444; letter-spacing: 5px;">RATING: 16+ | HORROR</div>
    
    <div style="margin-top: 40px; display: flex; gap: 20px;">
        <div>
            <span style="font-size: 10px; display: block; color: var(--neon-blue);">AVATAR</span>
            <select id="gender-select" style="background:#000; color:#fff; border:1px solid #333; padding:5px;">
                <option value="F">PROTOCOL-FEMALE</option>
                <option value="M">PROTOCOL-MALE</option>
            </select>
        </div>
        <div>
            <span style="font-size: 10px; display: block; color: var(--neon-blue);">WEATHER</span>
            <select id="weather-select" style="background:#000; color:#fff; border:1px solid #333; padding:5px;">
                <option value="rain">INDUSTRIAL RAIN</option>
                <option value="fog">VOID FOG</option>
            </select>
        </div>
    </div>

    <button class="btn-start" onclick="enterFacility()">Enter Facility</button>
</div>

<div id="gui-wrapper">
    <div id="subtitles"></div>
    <div id="controls-legend">
        <span><span class="key-hint">W A S D</span> MOVEMENT</span>
        <span><span class="key-hint">SHIFT</span> SPRINT</span>
        <span><span class="key-hint">F</span> FLASHLIGHT</span>
        <span><span class="key-hint">C</span> CROUCH</span>
        <span><span class="key-hint">SPACE</span> JUMP</span>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    let scene, camera, renderer, flashLight, clock;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();
    let isCrouching = false;
    let rainSystem;

    // This runs when the button is clicked
    function enterFacility() {
        console.log("Access Granted. Entering Facility...");
        const menu = document.getElementById('main-menu');
        menu.style.opacity = '0';
        
        setTimeout(() => {
            menu.style.display = 'none';
            document.getElementById('gui-wrapper').style.display = 'flex';
            initEngine();
            animate();
            playSequence();
        }, 1000);
    }

    function initEngine() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020202);
        scene.fog = new THREE.FogExp2(0x020202, 0.05);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = (document.getElementById('gender-select').value === 'F') ? 1.6 : 1.8;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Flashlight (Realistic SpotLight)
        flashLight = new THREE.SpotLight(0xffffff, 2, 40, Math.PI/7, 0.5, 2);
        flashLight.castShadow = true;
        camera.add(flashLight);
        camera.add(flashLight.target);
        flashLight.target.position.set(0, 0, -1);
        scene.add(camera);

        // Ambience
        scene.add(new THREE.AmbientLight(0x101010));

        // World Construction
        buildEnvironment();
        
        if(document.getElementById('weather-select').value === 'rain') initRain();

        // Control Listeners
        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);
        document.body.addEventListener('click', () => document.body.requestPointerLock());
        window.addEventListener('mousemove', onMouseMove);
    }

    function buildEnvironment() {
        // High-quality floor
        const floorGeo = new THREE.PlaneGeometry(2000, 2000);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.2, metalness: 0.5 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Walls/Architecture (GTA-style scaling)
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });
        for(let i=0; i<30; i++) {
            const pillar = new THREE.Mesh(new THREE.BoxGeometry(1.5, 12, 1.5), wallMat);
            pillar.position.set(i % 2 === 0 ? 8 : -8, 6, -i * 12);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            scene.add(pillar);
        }
    }

    function initRain() {
        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        for (let i = 0; i < 10000; i++) {
            vertices.push(Math.random() * 100 - 50, Math.random() * 50, Math.random() * 100 - 50);
        }
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        const material = new THREE.PointsMaterial({ color: 0x555555, size: 0.1 });
        rainSystem = new THREE.Points(geometry, material);
        scene.add(rainSystem);
    }

    function playSequence() {
        const lines = ["SUBJECT IDENTIFIED...", "LOCATION: SECTOR 4 LABORATORY", "OBJECTIVE: DON'T LOOK BACK."];
        let count = 0;
        const sub = document.getElementById('subtitles');
        const interval = setInterval(() => {
            sub.innerText = lines[count];
            sub.style.opacity = 1;
            setTimeout(() => sub.style.opacity = 0, 2000);
            count++;
            if(count >= lines.length) clearInterval(interval);
        }, 3500);
    }

    function onKeyDown(e) {
        switch(e.code) {
            case 'KeyW': moveForward = true; break;
            case 'KeyS': moveBackward = true; break;
            case 'KeyA': moveLeft = true; break;
            case 'KeyD': moveRight = true; break;
            case 'KeyF': flashLight.intensity = flashLight.intensity === 0 ? 2 : 0; break;
            case 'KeyC': isCrouching = true; camera.position.y -= 0.6; break;
        }
    }

    function onKeyUp(e) {
        switch(e.code) {
            case 'KeyW': moveForward = false; break;
            case 'KeyS': moveBackward = false; break;
            case 'KeyA': moveLeft = false; break;
            case 'KeyD': moveRight = false; break;
            case 'KeyC': isCrouching = false; camera.position.y += 0.6; break;
        }
    }

    function onMouseMove(e) {
        if(document.pointerLockElement === document.body) {
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();

        // Realistic Momentum
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        let speed = 60.0;
        if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

        camera.translateX(-velocity.x * delta);
        camera.translateZ(-velocity.z * delta);

        // Head Bob (GTA Realism)
        if(moveForward || moveBackward) {
            camera.position.y += Math.sin(Date.now() * 0.01) * 0.002;
        }

        // Rain animation
        if(rainSystem) {
            const positions = rainSystem.geometry.attributes.position.array;
            for (let i = 1; i < positions.length; i += 3) {
                positions[i] -= 0.5;
                if (positions[i] < 0) positions[i] = 50;
            }
            rainSystem.geometry.attributes.position.needsUpdate = true;
        }

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
