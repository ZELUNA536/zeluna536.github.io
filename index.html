<!DOCTYPE html>
<html>
<head>
<title>Space Mania</title>

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  background:black;
  font-family:Arial;
  color:white;
  overflow:hidden;
}

/* MENU */
#menu{
  position:absolute;
  width:100%;
  height:100%;
  background:radial-gradient(circle,#020024,#000);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
}
#menu h1{
  font-size:60px;
  color:cyan;
  text-shadow:0 0 30px cyan;
}
.btn{
  background:cyan;
  border:none;
  padding:15px 40px;
  font-size:18px;
  border-radius:30px;
  cursor:pointer;
  margin:10px;
}

/* GAME */
#game{
  width:100vw;
  height:300px;
  position:relative;
  background:linear-gradient(#020b2e,#000);
  overflow:hidden;
  border-bottom:3px solid cyan;
}

/* STARS */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  animation:moveStar linear infinite;
}
@keyframes moveStar{
  from{left:100%;}
  to{left:-5px;}
}

/* ROCKET */
#rocket{
  width:40px;
  height:60px;
  position:absolute;
  bottom:10px;
  left:80px;
  background:linear-gradient(cyan,blue);
  border-radius:10px;
  box-shadow:0 0 20px cyan;
}

/* OBSTACLE */
.obstacle{
  width:40px;
  height:60px;
  background:red;
  position:absolute;
  bottom:10px;
}

/* HUD */
#hud{
  position:absolute;
  top:10px;
  left:10px;
  font-size:18px;
  z-index:5;
}
</style>
</head>

<body>

<div id="menu">
  <h1>🚀 SPACE MANIA</h1>
  <p>High Score: <span id="best">0</span></p>
  <p>Select Difficulty</p>
  <button class="btn" onclick="startGame(3)">Easy</button>
  <button class="btn" onclick="startGame(2)">Normal</button>
  <button class="btn" onclick="startGame(1)">Hard</button>
</div>

<div id="hud">
  Score: <span id="score">0</span> |
  Level: <span id="level">1</span>
</div>

<div id="game">
  <div id="rocket"></div>
</div>

<!-- SOUND EFFECTS -->
<audio id="jumpSound" src="https://assets.mixkit.co/sfx/preview/mixkit-game-jump-437.mp3"></audio>
<audio id="crashSound" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-over-194.mp3"></audio>

<script>
let rocket = document.getElementById("rocket");
let game = document.getElementById("game");
let score = 0;
let level = 1;
let gravity = 0;
let jumping = false;
let speed = 3;
let running = false;

let jumpSound = document.getElementById("jumpSound");
let crashSound = document.getElementById("crashSound");

/* Load high score */
let best = localStorage.getItem("spaceManiaBest") || 0;
document.getElementById("best").innerText = best;

/* Jump */
function jump(){
  if(!jumping && running){
    gravity = 12;
    jumping = true;
    jumpSound.currentTime = 0;
    jumpSound.play();
  }
}
document.addEventListener("keydown",e=>{
  if(e.code==="Space") jump();
});
document.addEventListener("click",jump);

/* Start */
function startGame(diff){
  speed = diff;
  document.getElementById("menu").style.display="none";
  running = true;
  spawnObstacle();
  spawnStars();
}

/* Physics */
setInterval(()=>{
  if(!running) return;

  let bottom = parseInt(getComputedStyle(rocket).getPropertyValue("bottom"));
  bottom += gravity;
  gravity -= 1;

  if(bottom<=10){
    bottom=10;
    jumping=false;
  }

  rocket.style.bottom = bottom+"px";
},20);

/* Obstacles */
function spawnObstacle(){
  if(!running) return;

  let obs = document.createElement("div");
  obs.classList.add("obstacle");
  obs.style.left="100%";
  game.appendChild(obs);

  let move = setInterval(()=>{
    let left = obs.offsetLeft;
    obs.style.left = left - speed*4 + "px";

    let r = rocket.getBoundingClientRect();
    let o = obs.getBoundingClientRect();

    if(r.right>o.left && r.left<o.right && r.bottom>o.top){
      crashSound.play();
      endGame();
    }

    if(left<-50){
      obs.remove();
      clearInterval(move);
      score++;
      document.getElementById("score").innerText=score;

      if(score%10===0){
        level++;
        speed++;
        document.getElementById("level").innerText=level;
      }
    }
  },20);

  setTimeout(spawnObstacle,2000);
}

/* Stars */
function spawnStars(){
  if(!running) return;
  let star=document.createElement("div");
  star.className="star";
  star.style.top=Math.random()*300+"px";
  star.style.left="100%";
  star.style.animationDuration=Math.random()*3+2+"s";
  game.appendChild(star);
  setTimeout(()=>star.remove(),5000);
  setTimeout(spawnStars,200);
}

/* Game Over */
function endGame(){
  running=false;

  if(score>best){
    best=score;
    localStorage.setItem("spaceManiaBest",best);
  }

  setTimeout(()=>{
    alert("Game Over!\nScore: "+score+"\nHigh Score: "+best);
    location.reload();
  },300);
}
</script>

</body>
</html>
