<!DOCTYPE html>
<html>
<head>
<title>OB-MANIA</title>
<h6>Discord UID - zeluna_gg</h6>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3212/3212608.png">

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  background:black;
  font-family:Arial;
  color:white;
  overflow:hidden;
}

#menu{
  position:absolute;
  inset:0;
  background:black;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
}

#menu h1{
  font-size:55px;
  margin:10px;
}

.btn{
  padding:14px 40px;
  border:none;
  border-radius:30px;
  font-size:18px;
  cursor:pointer;
  margin:8px;
}

#game{
  width:100vw;
  height:300px;
  position:relative;
  overflow:hidden;
  border-bottom:3px solid white;
}

#rocket{
  width:40px;
  height:60px;
  position:absolute;
  bottom:10px;
  left:80px;
  border-radius:8px;
}

.obstacle{
  width:40px;
  height:80px;
  background:red;
  position:absolute;
  bottom:10px;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
}

#hud{
  position:absolute;
  top:10px;
  left:10px;
  z-index:5;
  font-size:18px;
}
</style>
</head>

<body>

<div id="menu">
  <h1>OB-MANIA</h1>

  <p>Select Rocket</p>
  <select id="skin">
    <option value="linear-gradient(white,gray)">Classic</option>
    <option value="linear-gradient(cyan,blue)">Neon</option>
    <option value="linear-gradient(orange,red)">Fire</option>
  </select>

  <p>High Score: <span id="best">0</span></p>
  <button class="btn" onclick="startGame()">PLAY</button>
</div>

<div id="hud">
Score: <span id="score">0</span> |
Level: <span id="level">1</span>
</div>

<div id="game">
  <div id="rocket"></div>
</div>

<!-- AUDIO -->
<audio id="jumpSound" src="https://assets.mixkit.co/sfx/preview/mixkit-game-jump-437.mp3"></audio>
<audio id="crashSound" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-over-194.mp3"></audio>
<audio id="bgm" src="https://assets.mixkit.co/music/preview/mixkit-space-game-668.mp3" loop></audio>

<script>
let rocket=document.getElementById("rocket");
let game=document.getElementById("game");
let score=0,level=1,best=localStorage.getItem("obmaniaBest")||0;
let gravity=0,jumping=false,running=false;
let speed=4,spawnRate=1600;

document.getElementById("best").innerText=best;

rocket.style.background=localStorage.getItem("skin")||"linear-gradient(white,gray)";

document.getElementById("skin").onchange=e=>{
  localStorage.setItem("skin",e.target.value);
  rocket.style.background=e.target.value;
};

function jump(){
  if(!jumping && running){
    gravity=20;
    jumping=true;
    jumpSound.currentTime=0;
    jumpSound.play();
  }
}

document.addEventListener("keydown",e=>{
  if(e.code==="Space") jump();
});
document.addEventListener("touchstart",jump);
document.addEventListener("click",jump);

function startGame(){
  document.getElementById("menu").style.display="none";
  running=true;
  bgm.volume=0.4;
  bgm.play();
  spawnObstacle();
  spawnStars();
}

setInterval(()=>{
  if(!running) return;
  let b=parseInt(getComputedStyle(rocket).getPropertyValue("bottom"));
  b+=gravity;
  gravity-=1.3;
  if(b<=10){b=10;jumping=false;}
  rocket.style.bottom=b+"px";
},20);

function spawnObstacle(){
  if(!running) return;
  let o=document.createElement("div");
  o.className="obstacle";
  o.style.left="100%";
  game.appendChild(o);

  let move=setInterval(()=>{
    o.style.left=o.offsetLeft-speed*5+"px";

    let r=rocket.getBoundingClientRect();
    let ob=o.getBoundingClientRect();

    if(r.right>ob.left && r.left<ob.right && r.bottom>ob.top){
      crashSound.play();
      endGame();
    }

    if(o.offsetLeft<-50){
      o.remove();
      clearInterval(move);
      score++;
      document.getElementById("score").innerText=score;
      updateLevel();
    }
  },20);

  setTimeout(spawnObstacle,spawnRate);
}

function updateLevel(){
  let newLevel=Math.floor(score/10)+1;
  if(newLevel!==level){
    level=newLevel;
    speed+=1;
    spawnRate=Math.max(800,spawnRate-150);
    document.getElementById("level").innerText=level;

    game.style.background=
      ["#020b2e","#021a3a","#2a003a","#3a0000"][level%4];
  }
}

function spawnStars(){
  if(!running) return;
  let s=document.createElement("div");
  s.className="star";
  s.style.top=Math.random()*300+"px";
  s.style.left="100%";
  game.appendChild(s);

  let move=setInterval(()=>{
    s.style.left=s.offsetLeft-2+"px";
    if(s.offsetLeft<-10){
      s.remove();
      clearInterval(move);
    }
  },50);

  setTimeout(spawnStars,300);
}

function endGame(){
  running=false;
  bgm.pause();
  if(score>best){
    best=score;
    localStorage.setItem("obmaniaBest",best);
  }
  setTimeout(()=>{
    alert("Game Over!\nScore: "+score+"\nHigh Score: "+best);
    location.reload();
  },300);
}
</script>

</body>
</html>
