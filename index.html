<!DOCTYPE html>
<html>
<head>
<title>OB-MANIA</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3212/3212608.png">

<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:Arial;
  overflow:hidden;
}
#menu,#pauseMenu{
  position:absolute;
  inset:0;
  background:black;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
}
button{
  padding:15px 40px;
  margin:10px;
  border:none;
  border-radius:30px;
  font-size:18px;
  cursor:pointer;
}
#game{
  width:100vw;
  height:300px;
  position:relative;
  overflow:hidden;
  border-bottom:3px solid white;
}
#rocket{
  width:40px;
  height:60px;
  position:absolute;
  bottom:10px;
  left:80px;
  background:linear-gradient(cyan,blue);
  border-radius:8px;
}
.obstacle{
  position:absolute;
  bottom:10px;
}
.wall{width:40px;height:80px;background:red;}
.tall{width:40px;height:130px;background:orange;}
.fly{width:40px;height:40px;background:yellow;bottom:120px;}
.spin{width:40px;height:40px;background:purple;animation:spin 1s linear infinite;}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
#hud{
  position:absolute;
  top:10px;
  left:10px;
}
</style>
</head>

<body>

<div id="menu">
<h1>OB-MANIA</h1>
<button onclick="startGame()">PLAY</button>
</div>

<div id="pauseMenu" style="display:none">
<h2>Paused</h2>
<button onclick="resume()">Resume</button>
<button onclick="restart()">Restart</button>
</div>

<div id="hud">
Score: <span id="score">0</span> |
Level: <span id="level">1</span>
<button onclick="pause()">⏸</button>
<button onclick="restart()">🔁</button>
</div>

<div id="game">
<div id="rocket"></div>
</div>

<audio id="jump" src="https://assets.mixkit.co/sfx/preview/mixkit-game-jump-437.mp3"></audio>
<audio id="crash" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-over-194.mp3"></audio>

<script>
let rocket=document.getElementById("rocket");
let game=document.getElementById("game");
let score=0,level=1;
let gravity=0,jumping=false,running=false,paused=false;
let speed=4,spawnRate=1600;

function startGame(){
  document.getElementById("menu").style.display="none";
  running=true;
  spawnObstacle();
}

function jump(){
  if(!jumping && running && !paused){
    gravity=18;
    jumping=true;
    document.getElementById("jump").play();
  }
}
document.addEventListener("keydown",e=>{
  if(e.code==="Space") jump();
  if(e.code==="KeyP") pause();
});
document.addEventListener("click",jump);

setInterval(()=>{
  if(!running || paused) return;
  let b=parseInt(getComputedStyle(rocket).getPropertyValue("bottom"));
  b+=gravity;
  gravity-=1.2;
  if(b<=10){b=10;jumping=false;}
  rocket.style.bottom=b+"px";
},20);

function spawnObstacle(){
  if(!running || paused) return;
  let o=document.createElement("div");
  let types=["wall","tall","fly","spin"];
  let type=types[Math.min(level-1,types.length-1)];
  o.className="obstacle "+type;
  o.style.left="100%";
  game.appendChild(o);

  let move=setInterval(()=>{
    if(paused) return;
    o.style.left=o.offsetLeft-speed*5+"px";

    let r=rocket.getBoundingClientRect();
    let ob=o.getBoundingClientRect();
    if(r.right>ob.left && r.left<ob.right && r.bottom>ob.top){
      document.getElementById("crash").play();
      alert("Game Over");
      location.reload();
    }

    if(o.offsetLeft<-50){
      o.remove();
      clearInterval(move);
      score++;
      document.getElementById("score").innerText=score;
      updateLevel();
    }
  },20);

  setTimeout(spawnObstacle,spawnRate);
}

function updateLevel(){
  let newLevel=Math.min(10,Math.floor(score/5)+1);
  if(newLevel!=level){
    level=newLevel;
    speed+=1;
    spawnRate=Math.max(700,spawnRate-120);
    document.getElementById("level").innerText=level;
  }
}

function pause(){
  paused=true;
  document.getElementById("pauseMenu").style.display="flex";
}
function resume(){
  paused=false;
  document.getElementById("pauseMenu").style.display="none";
}
function restart(){
  location.reload();
}
</script>

</body>
</html>
