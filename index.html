<!DOCTYPE html>
<html>
<head>
<title>OB-MANIA</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3212/3212608.png">

<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:Arial;
  overflow:hidden;
}

.screen{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
}

h1{font-size:64px;margin:10px;}

#ground{
  position:absolute;
  bottom:80px;
  width:100%;
  height:4px;
  background:white;
}

#game{
  position:absolute;
  bottom:0;
  width:100vw;
  height:300px;
  overflow:hidden;
}

#rocket{
  width:40px;
  height:60px;
  position:absolute;
  left:80px;
  bottom:80px;
  border-radius:8px;
}

.obstacle{
  position:absolute;
}

.wall{width:40px;height:80px;background:red;}
.tall{width:40px;height:130px;background:orange;}
.fly{width:40px;height:40px;background:yellow;}
.spin{width:40px;height:40px;background:purple;animation:spin 1s linear infinite;}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

button{
  padding:10px 25px;
  margin:5px;
  border:none;
  border-radius:20px;
  cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns:repeat(6,auto);
  gap:10px;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  z-index:5;
}
</style>
</head>

<body>

<div id="ground"></div>

<!-- MENU -->
<div id="menu" class="screen">
  <h1>OB-MANIA</h1>
  <button onclick="showLevels()">Play</button>
  <button onclick="showSkins()">Skins</button>
</div>

<!-- LEVELS -->
<div id="levels" class="screen" style="display:none">
  <h2>Select Level</h2>
  <div class="grid" id="levelGrid"></div>
  <button onclick="back()">Back</button>
</div>

<!-- SKINS -->
<div id="skins" class="screen" style="display:none">
  <h2>Select Rocket</h2>
  <div class="grid" id="skinGrid"></div>
  <button onclick="back()">Back</button>
</div>

<!-- HUD -->
<div id="hud">
Score: <span id="score">0</span> |
Level: <span id="level">1</span>
<button onclick="togglePause()">⏸</button>
<button onclick="restart()">⟲</button>
</div>

<div id="game">
  <div id="rocket"></div>
</div>

<audio id="jump" src="https://assets.mixkit.co/sfx/preview/mixkit-game-jump-437.mp3"></audio>
<audio id="crash" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-over-194.mp3"></audio>

<script>
/* CONSTANTS */
const GROUND_Y = 80;

/* ELEMENTS */
const rocket = document.getElementById("rocket");
const game = document.getElementById("game");

/* GAME STATE */
let score = 0;
let level = 1;
let gravity = 0;
let jumping = false;
let running = false;
let paused = false;
let speed = 6;
let spawnRate = 1400;

/* SKINS */
const skins = [
  "linear-gradient(cyan,blue)",
  "linear-gradient(red,orange)",
  "linear-gradient(lime,green)",
  "linear-gradient(purple,pink)",
  "linear-gradient(gold,orange)",
  "linear-gradient(white,gray)",
  "linear-gradient(deepskyblue,navy)",
  "linear-gradient(crimson,black)",
  "linear-gradient(aqua,teal)",
  "linear-gradient(violet,indigo)"
];

rocket.style.background = localStorage.getItem("skin") || skins[0];

/* LEVEL TYPES */
const levelTypes = [];
for(let i=1;i<=30;i++){
  if(i<=10) levelTypes.push("wall");
  else if(i<=20) levelTypes.push("tall");
  else levelTypes.push("fly");
}

/* BUILD LEVEL BUTTONS */
const lg = document.getElementById("levelGrid");
for(let i=1;i<=30;i++){
  const b = document.createElement("button");
  b.innerText = i;
  b.onclick = () => startGame(i);
  lg.appendChild(b);
}

/* BUILD SKINS */
const sg = document.getElementById("skinGrid");
skins.forEach(s=>{
  const b = document.createElement("button");
  b.style.background = s;
  b.style.width = "50px";
  b.style.height = "50px";
  b.onclick = () => {
    rocket.style.background = s;
    localStorage.setItem("skin", s);
  };
  sg.appendChild(b);
});

/* NAVIGATION */
function showLevels(){hideAll();levels.style.display="flex";}
function showSkins(){hideAll();skinsDiv.style.display="flex";}
function back(){hideAll();menu.style.display="flex";}
function hideAll(){document.querySelectorAll(".screen").forEach(s=>s.style.display="none");}

/* CONTROLS */
document.addEventListener("keydown",e=>{
  if(e.code==="Space") jump();
  if(e.code==="KeyP") togglePause();
  if(e.code==="KeyR") restart();
});
document.addEventListener("click",()=>{if(running&&!paused) jump();});

/* START GAME */
function startGame(l){
  hideAll();
  level = l;
  score = 0;
  running = true;
  paused = false;

  speed = 6 + Math.floor(level/3);
  spawnRate = 1400 - level * 20;

  document.getElementById("level").innerText = level;
  document.getElementById("score").innerText = score;

  document.querySelectorAll(".obstacle").forEach(o=>o.remove());
  setTimeout(spawnObstacle, 800);
}

/* JUMP */
function jump(){
  if(!jumping && running && !paused){
    gravity = 14;
    jumping = true;
    document.getElementById("jump").play();
  }
}

/* PHYSICS LOOP */
setInterval(()=>{
  if(!running || paused) return;

  let b = parseInt(getComputedStyle(rocket).bottom);
  b += gravity;
  gravity -= 1.2;

  if(b <= GROUND_Y){
    b = GROUND_Y;
    jumping = false;
  }

  rocket.style.bottom = b + "px";
},20);

/* OBSTACLES */
function spawnObstacle(){
  if(!running || paused) return;

  const o = document.createElement("div");
  const type = levelTypes[level-1];
  o.className = "obstacle " + type;
  o.style.left = "100%";

  if(type==="fly"){
    o.style.bottom = (GROUND_Y + 120) + "px";
  }else{
    o.style.bottom = GROUND_Y + "px";
  }

  game.appendChild(o);

  const move = setInterval(()=>{
    if(paused) return;

    o.style.left = o.offsetLeft - speed + "px";

    const r = rocket.getBoundingClientRect();
    const ob = o.getBoundingClientRect();

    if(
      r.right > ob.left &&
      r.left < ob.right &&
      r.bottom > ob.top &&
      r.top < ob.bottom
    ){
      document.getElementById("crash").play();
      alert("Game Over");
      restart();
    }

    if(o.offsetLeft < -50){
      clearInterval(move);
      o.remove();
      score++;
      document.getElementById("score").innerText = score;
    }
  },20);

  setTimeout(spawnObstacle, spawnRate);
}

/* PAUSE / RESTART */
function togglePause(){paused = !paused;}
function restart(){location.reload();}
</script>

</body>
</html>
